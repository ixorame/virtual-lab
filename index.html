<!DOCTYPE html>
<html>
<head>
  <title>Virtual Lab</title>

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      text-align: center;
      padding-top: 40px;
    }

    .box {
      background: white;
      width: 320px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
    }

    input {
      width: 100%;
      margin: 10px 0;
    }

    button {
      padding: 8px 15px;
      cursor: pointer;
    }

    #lab {
      display: none; /* hidden initially */
    }
  </style>
</head>

<body>

  <!-- Screen 1: Ask Experiment -->
  <div class="box" id="start">
    <h2>Virtual Lab</h2>
    <p>Enter Experiment Name</p>

    <input type="text" id="expName" placeholder="e.g. Ohm's Law">
    <button onclick="startExperiment()">Start Experiment</button>
  </div>

  <!-- Screen 2: Experiment Lab -->
  <div class="box" id="lab">
    <h2 id="labTitle"></h2>

    <p>Voltage (V)</p>
    <input type="range" id="voltage" min="0" max="20" value="0" oninput="calculate()">
    <p id="vValue">0 V</p>

    <p>Resistance (Ω)</p>
    <input type="range" id="resistance" min="1" max="100" value="1" oninput="calculate()">
    <p id="rValue">1 Ω</p>

    <h3>Current (I)</h3>
    <p id="current">0 A</p>
  </div>

  <script>
    function startExperiment() {
      const name = document.getElementById("expName").value;

      if (name === "") {
        alert("Please enter experiment name");
        return;
      }

      document.getElementById("labTitle").innerText = name;
      document.getElementById("start").style.display = "none";
      document.getElementById("lab").style.display = "block";
    }

    function calculate() {
      let V = document.getElementById("voltage").value;
      let R = document.getElementById("resistance").value;

      document.getElementById("vValue").innerText = V + " V";
      document.getElementById("rValue").innerText = R + " Ω";

      let I = (V / R).toFixed(2);
      document.getElementById("current").innerText = I + " A";
    }
  </script>

</body>
</html>
