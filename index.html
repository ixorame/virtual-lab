<!DOCTYPE html>
<html>
<head>
  <title>Virtual Lab – Ohm's Law</title>
  <style>
    body { font-family: Arial; }

    #palette {
      width: 180px;
      border: 2px solid black;
      padding: 10px;
      float: left;
    }

    .component {
      background: #ddd;
      padding: 6px;
      margin: 6px 0;
      cursor: grab;
      font-weight: bold;
      text-align: center;
    }

    #workspace {
      margin-left: 200px;
      width: 600px;
      height: 260px;
      border: 2px dashed black;
      position: relative;
    }

    .placed {
      position: absolute;
      background: #bde;
      padding: 6px;
      border: 2px solid black;
      cursor: pointer;
    }

    .selected {
      border-color: red;
    }

    #panel {
      clear: both;
      margin-top: 20px;
      border: 1px solid black;
      padding: 10px;
      width: 820px;
    }

    #experiment {
      opacity: 0.4;
      pointer-events: none;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2>Virtual Lab – Ohm’s Law (Logical Validation)</h2>

<!-- PALETTE -->
<div id="palette">
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="battery">Battery</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="ammeter">Ammeter</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="resistor">Resistor</div>
</div>

<!-- WORKSPACE -->
<div id="workspace" ondragover="allowDrop(event)" ondrop="drop(event)">
  Drop components here
</div>

<!-- PANEL -->
<div id="panel">
  <button onclick="validateCircuit()">Validate Circuit</button>
  <span id="result"></span>

  <!-- EXPERIMENT -->
  <div id="experiment">
    <h3>Ohm’s Law Experiment</h3>

    Voltage (V):<br>
    <input type="number" id="voltage"><br><br>

    Resistance (Ω):<br>
    <input type="number" id="resistance"><br><br>

    <button onclick="addReading()">Add Reading</button>

    <h4>Observation Table</h4>
    <table border="1">
      <thead>
        <tr><th>V</th><th>R</th><th>I</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <br>
    <button onclick="plotGraph()">Plot V–I Graph</button><br><br>
    <canvas id="graph" width="400" height="250" style="border:1px solid black;"></canvas>

    <h4>Simulation (Current Flow)</h4>
    <canvas id="sim" width="400" height="80" style="border:1px solid black;"></canvas>
  </div>
</div>

<script>
/* ---------- CIRCUIT BUILDER ---------- */

let componentCount = 0;
let placedComponents = [];
let connections = [];
let selected = null;
let circuitValidated = false;

/* ---------- EXPERIMENT ---------- */

let readings = [];
let simInterval = null;
let electronX = 20;

/* ---------- DRAG & DROP ---------- */

function drag(ev) {
  ev.dataTransfer.setData("type", ev.target.dataset.type);
}

function allowDrop(ev) {
  ev.preventDefault();
}

function drop(ev) {
  ev.preventDefault();
  const type = ev.dataTransfer.getData("type");

  componentCount++;
  const id = type + componentCount;

  const el = document.createElement("div");
  el.className = "placed";
  el.innerText = type;
  el.dataset.id = id;
  el.dataset.type = type;
  el.style.left = ev.offsetX + "px";
  el.style.top = ev.offsetY + "px";
  el.onclick = () => selectComponent(el);

  workspace.appendChild(el);
  placedComponents.push({ id, type });
}

/* ---------- CONNECTION LOGIC ---------- */

function selectComponent(el) {
  if (!selected) {
    selected = el;
    el.classList.add("selected");
  } else if (selected !== el) {
    connections.push({ from: selected.dataset.id, to: el.dataset.id });
    selected.classList.remove("selected");
    selected = null;
  }
}

/* ---------- VALIDATION ---------- */

function validateCircuit() {
  const ids = {};
  placedComponents.forEach(c => ids[c.type] = c.id);

  if (!ids.battery || !ids.ammeter || !ids.resistor) {
    fail("Battery, Ammeter, and Resistor required");
    return;
  }

  if (
    isConnected(ids.battery, ids.ammeter) &&
    isConnected(ids.ammeter, ids.resistor) &&
    isConnected(ids.resistor, ids.battery)
  ) {
    circuitValidated = true;
    result.innerText = " ✔ Circuit Correct — Experiment Unlocked";
    result.style.color = "green";
    unlockExperiment();
  } else {
    fail("Incorrect series loop");
  }
}

function isConnected(a, b) {
  return connections.some(c =>
    (c.from === a && c.to === b) || (c.from === b && c.to === a)
  );
}

function fail(msg) {
  circuitValidated = false;
  result.innerText = " ✖ " + msg;
  result.style.color = "red";
  lockExperiment();
  stopSimulation();
}

/* ---------- EXPERIMENT GATE ---------- */

function unlockExperiment() {
  experiment.style.opacity = "1";
  experiment.style.pointerEvents = "auto";
}

function lockExperiment() {
  experiment.style.opacity = "0.4";
  experiment.style.pointerEvents = "none";
}

/* ---------- EXPERIMENT LOGIC ---------- */

function addReading() {
  if (!circuitValidated) return;

  const V = Number(voltage.value);
  const R = Number(resistance.value);
  if (V <= 0 || R <= 0) return;

  const I = (V / R).toFixed(3);
  readings.push({ V, I });

  tableBody.innerHTML += `<tr><td>${V}</td><td>${R}</td><td>${I}</td></tr>`;
  startSimulation(Number(I));
}

function plotGraph() {
  if (!circuitValidated || readings.length === 0) return;

  const ctx = graph.getContext("2d");
  ctx.clearRect(0,0,400,250);

  ctx.beginPath();
  ctx.moveTo(40,10);
  ctx.lineTo(40,220);
  ctx.lineTo(380,220);
  ctx.stroke();

  const maxV = Math.max(...readings.map(r=>r.V));
  const maxI = Math.max(...readings.map(r=>r.I));

  ctx.beginPath();
  readings.forEach((r,i)=>{
    const x = 40 + (r.V/maxV)*320;
    const y = 220 - (r.I/maxI)*200;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();
}

/* ---------- SIMULATION ---------- */

function startSimulation(current) {
  const ctx = sim.getContext("2d");
  if (simInterval) clearInterval(simInterval);
  electronX = 20;
  const speed = Math.max(current * 10, 2);

  simInterval = setInterval(()=>{
    ctx.clearRect(0,0,400,80);
    ctx.fillStyle="black";
    ctx.fillRect(10,35,380,8);

    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(electronX,39,5,0,Math.PI*2);
    ctx.fill();

    electronX += speed;
    if (electronX > 390) electronX = 10;
  },100);
}

function stopSimulation() {
  if (simInterval) clearInterval(simInterval);
}
</script>

</body>
</html>
