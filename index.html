<!DOCTYPE html>
<html>
<head>
  <title>Screen Test</title>
</head>

<body>

<div id="screen1">
  <h2>Screen 1</h2>
  <button onclick="goNext()">Go to Screen 2</button>
</div>

<div id="screen2" style="display:none;">
  <h2>Screen 2</h2>
  <p>You reached the next screen.</p>
</div>

<script>
  function goNext() {
    document.getElementById("screen1").style.display = "none";
    document.getElementById("screen2").style.display = "block";
  }
</script>

</body>
</html>
