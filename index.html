<!DOCTYPE html>
<html>
<head>
  <style>
    #palette {
      width: 180px;
      padding: 10px;
      border: 2px solid black;
      float: left;
    }

    #workspace {
      margin-left: 200px;
      width: 600px;
      height: 350px;
      border: 2px dashed black;
      position: relative;
    }

    .component {
      padding: 8px;
      margin: 6px 0;
      background-color: lightgray;
      cursor: grab;
      text-align: center;
      font-weight: bold;
    }

    .placed {
      position: absolute;
      background-color: lightblue;
      padding: 8px;
      border: 1px solid black;
      cursor: default;
    }

    #status {
      clear: both;
      margin-top: 20px;
      padding: 10px;
      border: 1px solid black;
      width: 780px;
    }
  </style>
</head>

<body>

<h2>Drag & Drop Circuit Builder</h2>

<!-- COMPONENT PALETTE -->
<div id="palette">
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="battery">
    Battery
  </div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="resistor">
    Resistor
  </div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="ammeter">
    Ammeter
  </div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="voltmeter">
    Voltmeter
  </div>
</div>

<!-- WORKSPACE -->
<div id="workspace" ondragover="allowDrop(event)" ondrop="drop(event)">
  Drop components here
</div>

<!-- STATUS PANEL -->
<div id="status">
  <h3>Placed Components (Internal State)</h3>
  <ul id="componentList"></ul>
</div>

<script>
  let componentCount = 0;
  let placedComponents = [];

  function drag(ev) {
    ev.dataTransfer.setData("type", ev.target.dataset.type);
    ev.dataTransfer.setData("label", ev.target.innerText);
  }

  function allowDrop(ev) {
    ev.preventDefault();
  }

  function drop(ev) {
    ev.preventDefault();

    const type = ev.dataTransfer.getData("type");
    const label = ev.dataTransfer.getData("label");

    componentCount++;

    const id = type + componentCount;

    // Visual element
    const comp = document.createElement("div");
    comp.className = "placed";
    comp.innerText = label;
    comp.dataset.type = type;
    comp.dataset.id = id;

    comp.style.left = ev.offsetX + "px";
    comp.style.top = ev.offsetY + "px";

    ev.target.appendChild(comp);

    // Logical model (IMPORTANT)
    placedComponents.push({
      id: id,
      type: type,
      x: ev.offsetX,
      y: ev.offsetY
    });

    updateStatus();
  }

  function updateStatus() {
    const list = document.getElementById("componentList");
    list.innerHTML = "";

    placedComponents.forEach(c => {
      const li = document.createElement("li");
      li.innerText = `${c.id} → ${c.type}`;
      list.appendChild(li);
    });
  }
</script>

</body>
</html>
