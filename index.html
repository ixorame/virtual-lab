<!DOCTYPE html>
<html>
<body>

<!-- ================= SCREEN 1 ================= -->
<div id="screen1">
  <h2>Virtual Lab</h2>

  <label>Select Experiment</label><br><br>
  <select id="experiment">
    <option value="">-- Select --</option>
    <option value="ohm">Ohm's Law</option>
  </select><br><br>

  <button onclick="goNext()">Start Experiment</button>
</div>

<!-- ================= SCREEN 2 ================= -->
<div id="screen2" style="display:none;">
  <h2 id="expTitle"></h2>

  <h3>Enter Values</h3>

  Voltage (V):<br>
  <input type="number" id="voltage" step="0.1"><br><br>

  Resistance (Ω):<br>
  <input type="number" id="resistance" step="0.1"><br><br>

  <button onclick="addReading()">Add Reading</button>

  <h3>Observation Table</h3>
  <table border="1" cellpadding="5">
    <thead>
      <tr>
        <th>Voltage (V)</th>
        <th>Resistance (Ω)</th>
        <th>Current (A)</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- ================= SCRIPT ================= -->
<script>
  function goNext() {
    const exp = document.getElementById("experiment").value;

    if (exp === "") {
      alert("Please select an experiment");
      return;
    }

    document.getElementById("screen1").style.display = "none";
    document.getElementById("screen2").style.display = "block";
    document.getElementById("expTitle").innerText = "Ohm's Law Experiment";
  }

  function addReading() {
    const V = Number(document.getElementById("voltage").value);
    const R = Number(document.getElementById("resistance").value);

    if (V <= 0 || R <= 0) {
      alert("Enter valid Voltage and Resistance");
      return;
    }

    const I = (V / R).toFixed(3);

    const row = `
      <tr>
        <td>${V}</td>
        <td>${R}</td>
        <td>${I}</td>
      </tr>
    `;

    document.getElementById("tableBody").innerHTML += row;

    // clear inputs for next reading
    document.getElementById("voltage").value = "";
    document.getElementById("resistance").value = "";
  }
</script>

</body>
</html>
