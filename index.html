<!DOCTYPE html>
<html>
<body>

<!-- SCREEN 1 -->
<div id="screen1">
  <h2>Virtual Lab</h2>

  <label>Select Experiment:</label><br><br>
  <select id="experiment">
    <option value="">-- Select --</option>
    <option value="Ohm's Law">Ohm's Law</option>
    <option value="Series Resistance">Series Resistance</option>
  </select>
  <br><br>

  <button onclick="goNext()">Start</button>
</div>

<!-- SCREEN 2 -->
<div id="screen2" style="display:none;">

  <h2 id="expName"></h2>

  <!-- THEORY -->
  <h3>Theory</h3>
  <p>
    This experiment demonstrates the relationship between electrical quantities.
    The governing principle explains how input parameters affect the output.
  </p>

  <!-- PROCEDURE -->
  <h3>Procedure</h3>
  <ol>
    <li>Select the experiment.</li>
    <li>Enter the required input values.</li>
    <li>Observe the output.</li>
  </ol>

  <!-- INPUT SECTION -->
  <h3>Enter Values</h3>

  <label>Voltage (V):</label><br>
  <input type="number" id="voltage"><br><br>

  <label>Resistance (Ω):</label><br>
  <input type="number" id="resistance"><br><br>

  <button>Add Reading</button>

</div>

<script>
  function goNext() {
    const exp = document.getElementById("experiment").value;

    if (exp === "") {
      alert("Please select an experiment");
      return;
    }

    document.getElementById("screen1").style.display = "none";
    document.getElementById("screen2").style.display = "block";
    document.getElementById("expName").innerText = exp;
  }
</script>

</body>
</html>
