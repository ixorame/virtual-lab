<!DOCTYPE html>
<html>
<head>
  <title>Virtual Lab with Wiring</title>
  <style>
    body { font-family: Arial; background:#f4f6f8; }
    .screen { display:none; padding:20px; }
    .active { display:block; }
    button { padding:8px 14px; margin-top:10px; }

    #workspace {
      width:600px;
      height:260px;
      border:2px dashed black;
      position:relative;
      background:#fff;
    }

    .component {
      position:absolute;
      padding:6px;
      border:2px solid #333;
      background:#ddd;
      cursor:pointer;
      user-select:none;
    }

    .selected { border-color:red; }

    canvas { position:absolute; left:0; top:0; pointer-events:none; }
  </style>
</head>

<body>

<h2 align="center">Virtual Laboratory</h2>

<!-- SCREEN 1 -->
<div class="screen active" id="screen1">
  <h3>Select Experiment</h3>
  <select id="experimentSelect">
    <option value="ohm">Ohm’s Law</option>
  </select><br>
  <button onclick="goToScreen(2)">Next</button>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="screen2">
  <h3>Ohm’s Law</h3>
  <h4>Theory</h4>
  <p>V = IR</p>
  <h4>Procedure</h4>
  <ol>
    <li>Connect battery, ammeter, resistor in series</li>
    <li>Connect voltmeter across resistor</li>
    <li>Validate circuit</li>
  </ol>
  <button onclick="goToScreen(3)">Proceed to Circuit</button>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="screen3">
  <h3>Make Circuit Connections</h3>

  <button onclick="addComponent('battery')">Battery</button>
  <button onclick="addComponent('ammeter')">Ammeter</button>
  <button onclick="addComponent('resistor')">Resistor</button>
  <button onclick="addComponent('voltmeter')">Voltmeter</button>

  <br><br>

  <div id="workspace">
    <canvas id="wires" width="600" height="260"></canvas>
  </div>

  <br>
  <button onclick="validateCircuit()">Validate Circuit</button>
  <p id="circuitResult"></p>

  <button id="nextBtn" style="display:none;" onclick="goToScreen(4)">Next</button>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="screen4">
  <h3>Observation & Graph</h3>

  Voltage (V):
  <input id="V" type="number">
  Resistance (Ω):
  <input id="R" type="number">
  <button onclick="addRow()">Add</button>

  <table border="1">
    <thead>
      <tr><th>V</th><th>I</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <br>
  <button onclick="plotGraph()">Plot Graph</button><br><br>
  <canvas id="graph" width="400" height="250" style="border:1px solid black;"></canvas>
</div>

<script>
/* ===== SCREEN CONTROL ===== */
function goToScreen(n){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen"+n).classList.add("active");
}

/* ===== CIRCUIT & WIRING ===== */
let components = [];
let connections = [];
let selected = null;
let idCount = 0;

function addComponent(type){
  const el = document.createElement("div");
  el.className = "component";
  el.innerText = type;
  el.dataset.id = type + (++idCount);
  el.dataset.type = type;
  el.style.left = Math.random()*500 + "px";
  el.style.top = Math.random()*200 + "px";
  el.onclick = () => selectComponent(el);

  workspace.appendChild(el);
  components.push(el);
}

function selectComponent(el){
  if(!selected){
    selected = el;
    el.classList.add("selected");
  } else if(selected !== el){
    connections.push([selected, el]);
    selected.classList.remove("selected");
    selected = null;
    drawWires();
  }
}

function drawWires(){
  const c = wires.getContext("2d");
  c.clearRect(0,0,600,260);
  connections.forEach(pair=>{
    const a = pair[0].getBoundingClientRect();
    const b = pair[1].getBoundingClientRect();
    const wa = workspace.getBoundingClientRect();
    c.beginPath();
    c.moveTo(a.left-wa.left+20, a.top-wa.top+10);
    c.lineTo(b.left-wa.left+20, b.top-wa.top+10);
    c.stroke();
  });
}

/* ===== VALIDATION ===== */
function validateCircuit(){
  const types = components.map(c=>c.dataset.type);
  const needed = ["battery","ammeter","resistor","voltmeter"];
  const ok = needed.every(t=>types.includes(t)) && connections.length >= 3;

  circuitResult.innerText = ok ? "✔ Correct wiring" : "✖ Incorrect wiring";
  circuitResult.style.color = ok ? "green" : "red";
  if(ok) nextBtn.style.display="inline-block";
}

/* ===== OBSERVATION & GRAPH ===== */
let readings=[];
function addRow(){
  const V=Number(document.getElementById("V").value);
  const R=Number(document.getElementById("R").value);
  if(V<=0||R<=0)return;
  const I=(V/R).toFixed(3);
  readings.push({V,I});
  tableBody.innerHTML+=`<tr><td>${V}</td><td>${I}</td></tr>`;
}

function plotGraph(){
  const ctx=graph.getContext("2d");
  ctx.clearRect(0,0,400,250);
  ctx.beginPath(); ctx.moveTo(40,10); ctx.lineTo(40,220); ctx.lineTo(380,220); ctx.stroke();
  const maxV=Math.max(...readings.map(r=>r.V));
  const maxI=Math.max(...readings.map(r=>r.I));
  ctx.beginPath();
  readings.forEach((r,i)=>{
    const x=40+(r.V/maxV)*320;
    const y=220-(r.I/maxI)*200;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  });
  ctx.stroke();
}
</script>

</body>
</html>
