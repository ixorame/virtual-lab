<!DOCTYPE html>
<html>
<head>
  <style>
    #palette { width:180px; float:left; border:2px solid black; padding:10px; }
    #workspace { margin-left:200px; width:600px; height:300px; border:2px dashed black; position:relative; }
    .component { background:#ddd; padding:6px; margin:6px 0; cursor:grab; text-align:center; font-weight:bold; }
    .placed { position:absolute; background:#bde; padding:6px; border:2px solid black; cursor:pointer; }
    .selected { border-color:red; }
    #panel { clear:both; margin-top:20px; border:1px solid black; padding:10px; width:800px; }
    #experiment { opacity:0.4; pointer-events:none; }
  </style>
</head>

<body>

<h2>Virtual Lab — Circuit + Experiment</h2>

<!-- PALETTE -->
<div id="palette">
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="battery">Battery</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="ammeter">Ammeter</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="resistor">Resistor</div>
</div>

<!-- WORKSPACE -->
<div id="workspace" ondragover="allowDrop(event)" ondrop="drop(event)">
  Drop components here
</div>

<!-- CONTROL PANEL -->
<div id="panel">
  <button onclick="validateCircuit()">Validate Circuit</button>
  <div id="result"></div>

  <!-- EXPERIMENT (LOCKED INITIALLY) -->
  <div id="experiment">
    <h3>Ohm’s Law Experiment</h3>

    Voltage (V):<br>
    <input type="number" id="voltage"><br><br>

    Resistance (Ω):<br>
    <input type="number" id="resistance"><br><br>

    <button onclick="addReading()">Add Reading</button>

    <h4>Observation Table</h4>
    <table border="1">
      <thead>
        <tr><th>V</th><th>R</th><th>I</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <br>
    <button onclick="plotGraph()">Plot V–I Graph</button>
    <br><br>
    <canvas id="graph" width="400" height="250" style="border:1px solid black;"></canvas>
  </div>
</div>

<script>
  let componentCount = 0;
  let placedComponents = [];
  let connections = [];
  let selected = null;
  let circuitValidated = false;
  let readings = [];

  function drag(ev) {
    ev.dataTransfer.setData("type", ev.target.dataset.type);
  }

  function allowDrop(ev) { ev.preventDefault(); }

  function drop(ev) {
    ev.preventDefault();
    const type = ev.dataTransfer.getData("type");
    componentCount++;
    const id = type + componentCount;

    const el = document.createElement("div");
    el.className = "placed";
    el.innerText = type;
    el.dataset.id = id;
    el.dataset.type = type;
    el.style.left = ev.offsetX + "px";
    el.style.top = ev.offsetY + "px";
    el.onclick = () => select(el);

    ev.target.appendChild(el);
    placedComponents.push({ id, type });
  }

  function select(el) {
    if (!selected) {
      selected = el;
      el.classList.add("selected");
    } else if (selected !== el) {
      connections.push({ from: selected.dataset.id, to: el.dataset.id });
      selected.classList.remove("selected");
      selected = null;
    }
  }

  function validateCircuit() {
    const ids = {};
    placedComponents.forEach(c => ids[c.type] = c.id);

    if (!ids.battery || !ids.ammeter || !ids.resistor) {
      fail("Battery, Ammeter, Resistor required");
      return;
    }

    if (
      isConnected(ids.battery, ids.ammeter) &&
      isConnected(ids.ammeter, ids.resistor) &&
      isConnected(ids.resistor, ids.battery)
    ) {
      circuitValidated = true;
      document.getElementById("result").innerText = "✔ Circuit Correct — Experiment Unlocked";
      document.getElementById("result").style.color = "green";
      unlockExperiment();
    } else {
      fail("Incorrect series loop");
    }
  }

  function isConnected(a, b) {
    return connections.some(c =>
      (c.from === a && c.to === b) || (c.from === b && c.to === a)
    );
  }

  function fail(msg) {
    circuitValidated = false;
    document.getElementById("result").innerText = "✖ " + msg;
    document.getElementById("result").style.color = "red";
    lockExperiment();
  }

  function unlockExperiment() {
    const e = document.getElementById("experiment");
    e.style.opacity = "1";
    e.style.pointerEvents = "auto";
  }

  function lockExperiment() {
    const e = document.getElementById("experiment");
    e.style.opacity = "0.4";
    e.style.pointerEvents = "none";
  }

  /* -------- EXPERIMENT -------- */

  function addReading() {
    if (!circuitValidated) return;

    const V = Number(voltage.value);
    const R = Number(resistance.value);
    if (V <= 0 || R <= 0) return;

    const I = (V / R).toFixed(3);
    readings.push({ V, I });

    tableBody.innerHTML += `<tr><td>${V}</td><td>${R}</td><td>${I}</td></tr>`;
  }

  function plotGraph() {
    if (!circuitValidated || readings.length === 0) return;

    const c = graph.getContext("2d");
    c.clearRect(0,0,400,250);
    c.beginPath();
    c.moveTo(40,10); c.lineTo(40,220); c.lineTo(380,220); c.stroke();

    const maxV = Math.max(...readings.map(r=>r.V));
    const maxI = Math.max(...readings.map(r=>r.I));

    c.beginPath();
    readings.forEach((r,i)=>{
      const x = 40 + (r.V/maxV)*320;
      const y = 220 - (r.I/maxI)*200;
      i===0 ? c.moveTo(x,y) : c.lineTo(x,y);
    });
    c.stroke();
  }
</script>

</body>
</html>
