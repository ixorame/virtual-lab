<!DOCTYPE html>
<html>
<head>
  <title>Virtual Lab – Multiple Experiments</title>
  <style>
    body { font-family: Arial; }

    #palette {
      width: 180px;
      border: 2px solid black;
      padding: 10px;
      float: left;
    }

    .component {
      background: #ddd;
      padding: 6px;
      margin: 6px 0;
      cursor: grab;
      font-weight: bold;
      text-align: center;
    }

    #workspace {
      margin-left: 200px;
      width: 600px;
      height: 260px;
      border: 2px dashed black;
      position: relative;
    }

    .placed {
      position: absolute;
      background: #bde;
      padding: 6px;
      border: 2px solid black;
      cursor: pointer;
    }

    .selected { border-color: red; }

    #panel {
      clear: both;
      margin-top: 20px;
      border: 1px solid black;
      padding: 10px;
      width: 820px;
    }

    #experiment {
      opacity: 0.4;
      pointer-events: none;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2>Virtual Lab – Logical Circuit Validation</h2>

<!-- EXPERIMENT SELECTION -->
<label>Select Experiment:</label>
<select id="experimentSelect" onchange="resetLab()">
  <option value="ohm">Ohm's Law</option>
  <option value="series">Series Resistance</option>
</select>

<br><br>

<!-- PALETTE -->
<div id="palette">
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="battery">Battery</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="ammeter">Ammeter</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="resistor">Resistor</div>
</div>

<!-- WORKSPACE -->
<div id="workspace" ondragover="allowDrop(event)" ondrop="drop(event)">
  Drop components here
</div>

<!-- PANEL -->
<div id="panel">
  <button onclick="validateCircuit()">Validate Circuit</button>
  <span id="result"></span>

  <!-- EXPERIMENT AREA -->
  <div id="experiment">
    <h3 id="expTitle"></h3>

    <div id="inputs"></div>

    <button onclick="addReading()">Add Reading</button>

    <h4>Observation Table</h4>
    <table border="1">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>

    <br>
    <button onclick="plotGraph()">Plot Graph</button><br><br>
    <canvas id="graph" width="400" height="250" style="border:1px solid black;"></canvas>

    <h4>Simulation</h4>
    <canvas id="sim" width="400" height="80" style="border:1px solid black;"></canvas>
  </div>
</div>

<script>
/* ========== EXPERIMENT DEFINITIONS ========== */

const experiments = {
  ohm: {
    title: "Ohm's Law",
    inputs: ["V", "R"],
    table: ["V", "R", "I"],
    validateCircuit: ids =>
      isConnected(ids.battery, ids.ammeter) &&
      isConnected(ids.ammeter, ids.resistor) &&
      isConnected(ids.resistor, ids.battery),
    calculate: vals => ({ I: (vals.V / vals.R).toFixed(3) }),
    graph: true,
    simulate: true
  },

  series: {
    title: "Series Resistance",
    inputs: ["R1", "R2"],
    table: ["R1", "R2", "Req"],
    validateCircuit: ids =>
      isConnected(ids.battery, ids.ammeter) &&
      isConnected(ids.ammeter, ids.resistor) &&
      isConnected(ids.resistor, ids.battery),
    calculate: vals => ({ Req: (vals.R1 + vals.R2).toFixed(2) }),
    graph: false,
    simulate: false
  }
};

/* ========== STATE ========== */

let placedComponents = [];
let connections = [];
let selected = null;
let componentCount = 0;
let readings = [];
let circuitValidated = false;
let simInterval = null;
let electronX = 20;

/* ========== DRAG & DROP ========== */

function drag(ev) {
  ev.dataTransfer.setData("type", ev.target.dataset.type);
}

function allowDrop(ev) { ev.preventDefault(); }

function drop(ev) {
  ev.preventDefault();
  const type = ev.dataTransfer.getData("type");
  componentCount++;

  const el = document.createElement("div");
  el.className = "placed";
  el.innerText = type;
  el.dataset.id = type + componentCount;
  el.dataset.type = type;
  el.style.left = ev.offsetX + "px";
  el.style.top = ev.offsetY + "px";
  el.onclick = () => select(el);

  workspace.appendChild(el);
  placedComponents.push({ id: el.dataset.id, type });
}

function select(el) {
  if (!selected) {
    selected = el;
    el.classList.add("selected");
  } else {
    connections.push({ from: selected.dataset.id, to: el.dataset.id });
    selected.classList.remove("selected");
    selected = null;
  }
}

/* ========== VALIDATION ========== */

function validateCircuit() {
  const exp = experiments[experimentSelect.value];
  const ids = {};
  placedComponents.forEach(c => ids[c.type] = c.id);

  if (!ids.battery || !ids.ammeter || !ids.resistor) {
    fail("Missing required components");
    return;
  }

  if (exp.validateCircuit(ids)) {
    circuitValidated = true;
    unlockExperiment();
    result.innerText = "✔ Correct Circuit";
    result.style.color = "green";
  } else {
    fail("Incorrect connections");
  }
}

function isConnected(a,b) {
  return connections.some(c =>
    (c.from===a && c.to===b) || (c.from===b && c.to===a)
  );
}

function fail(msg) {
  circuitValidated = false;
  lockExperiment();
  result.innerText = "✖ " + msg;
  result.style.color = "red";
}

/* ========== EXPERIMENT ENGINE ========== */

function unlockExperiment() {
  experiment.style.opacity = "1";
  experiment.style.pointerEvents = "auto";
  setupExperimentUI();
}

function lockExperiment() {
  experiment.style.opacity = "0.4";
  experiment.style.pointerEvents = "none";
}

function setupExperimentUI() {
  const exp = experiments[experimentSelect.value];
  expTitle.innerText = exp.title;

  inputs.innerHTML = exp.inputs.map(i =>
    `${i}:<br><input type="number" id="${i}"><br><br>`
  ).join("");

  tableHead.innerHTML = "<tr>" + exp.table.map(h=>`<th>${h}</th>`).join("") + "</tr>";
  tableBody.innerHTML = "";
  readings = [];
}

function addReading() {
  if (!circuitValidated) return;
  const exp = experiments[experimentSelect.value];

  const vals = {};
  exp.inputs.forEach(i => vals[i] = Number(document.getElementById(i).value));

  const result = exp.calculate(vals);
  readings.push({ ...vals, ...result });

  tableBody.innerHTML += "<tr>" +
    exp.table.map(k=>`<td>${vals[k] ?? result[k]}</td>`).join("") +
    "</tr>";

  if (exp.simulate) startSimulation(result.I);
}

function plotGraph() {
  const exp = experiments[experimentSelect.value];
  if (!exp.graph || readings.length === 0) return;

  const ctx = graph.getContext("2d");
  ctx.clearRect(0,0,400,250);

  ctx.beginPath();
  ctx.moveTo(40,10); ctx.lineTo(40,220); ctx.lineTo(380,220); ctx.stroke();

  const maxX = Math.max(...readings.map(r=>r.V));
  const maxY = Math.max(...readings.map(r=>r.I));

  ctx.beginPath();
  readings.forEach((r,i)=>{
    const x = 40 + (r.V/maxX)*320;
    const y = 220 - (r.I/maxY)*200;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();
}

/* ========== SIMULATION ========== */

function startSimulation(current) {
  const ctx = sim.getContext("2d");
  if (simInterval) clearInterval(simInterval);
  electronX = 20;

  simInterval = setInterval(()=>{
    ctx.clearRect(0,0,400,80);
    ctx.fillRect(10,35,380,8);
    ctx.beginPath();
    ctx.arc(electronX,39,5,0,Math.PI*2);
    ctx.fill();
    electronX += Math.max(current*10,2);
    if (electronX>390) electronX=10;
  },100);
}

/* ========== RESET ========== */

function resetLab() {
  workspace.innerHTML = "Drop components here";
  placedComponents=[];
  connections=[];
  componentCount=0;
  readings=[];
  circuitValidated=false;
  lockExperiment();
  result.innerText="";
}
</script>

</body>
</html>
