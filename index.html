<!DOCTYPE html>
<html>
<body>

<!-- ================= SCREEN 1 ================= -->
<div id="screen1">
  <h2>Virtual Lab</h2>

  <select id="experimentSelect">
    <option value="">-- Select Experiment --</option>
    <option value="ohm">Ohm's Law</option>
    <option value="series">Series Resistance</option>
  </select>
  <br><br>

  <button onclick="startExperiment()">Start</button>
</div>

<!-- ================= SCREEN 2 ================= -->
<div id="screen2" style="display:none;">

  <h2 id="expTitle"></h2>

  <!-- THEORY -->
  <h3>Theory</h3>
  <p id="theoryText"></p>

  <!-- PROCEDURE -->
  <h3>Procedure</h3>
  <ol id="procedureList"></ol>

  <!-- INPUT -->
  <h3>Enter Values</h3>
  <div id="inputArea"></div>

  <button onclick="addReading()">Add Reading</button>

  <!-- TABLE -->
  <h3>Observation Table</h3>
  <table border="1" cellpadding="6">
    <thead>
      <tr id="tableHead"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <br>
  <button onclick="plotGraph()">Plot Graph</button>

  <!-- GRAPH -->
  <h3>Graph</h3>
  <canvas id="graph" width="400" height="300" style="border:1px solid black;"></canvas>

</div>

<script>
/* ================= EXPERIMENT DEFINITIONS ================= */

const experiments = {
  ohm: {
    title: "Ohm's Law Experiment",
    theory:
      "Ohm’s Law states that current is directly proportional to voltage at constant temperature. V = I × R.",
    procedure: [
      "Apply voltage across the resistor.",
      "Note voltage and resistance.",
      "Calculate current."
    ],
    inputs: ["V", "R"],
    output: "I",
    formula: (V, R) => V / R
  },

  series: {
    title: "Series Resistance Experiment",
    theory:
      "Equivalent resistance in series is the sum of individual resistances. Req = R1 + R2.",
    procedure: [
      "Connect resistors in series.",
      "Note R1 and R2.",
      "Calculate equivalent resistance."
    ],
    inputs: ["R1", "R2"],
    output: "Req",
    formula: (R1, R2) => R1 + R2
  }
};

let currentExperiment = null;
let readings = [];

/* ================= START ================= */

function startExperiment() {
  const key = document.getElementById("experimentSelect").value;
  if (!key) {
    alert("Select an experiment");
    return;
  }

  currentExperiment = experiments[key];
  readings = [];

  document.getElementById("screen1").style.display = "none";
  document.getElementById("screen2").style.display = "block";

  setupUI();
}

/* ================= UI SETUP ================= */

function setupUI() {
  document.getElementById("expTitle").innerText = currentExperiment.title;
  document.getElementById("theoryText").innerText = currentExperiment.theory;

  let procHTML = "";
  currentExperiment.procedure.forEach(step => {
    procHTML += <li>${step}</li>;
  });
  document.getElementById("procedureList").innerHTML = procHTML;

  let inputHTML = "";
  currentExperiment.inputs.forEach(name => {
    inputHTML += `
      ${name}:<br>
      <input type="number" id="${name}" step="0.1"><br><br>
    `;
  });
  document.getElementById("inputArea").innerHTML = inputHTML;

  let headHTML = "";
  currentExperiment.inputs.forEach(name => {
    headHTML += <th>${name}</th>;
  });
  headHTML += <th>${currentExperiment.output}</th>;
  document.getElementById("tableHead").innerHTML = headHTML;

  document.getElementById("tableBody").innerHTML = "";
  clearGraph();
}

/* ================= ADD READING ================= */

function addReading() {
  let values = [];

  for (let name of currentExperiment.inputs) {
    const val = Number(document.getElementById(name).value);
    if (val <= 0) {
      alert("Enter valid values");
      return;
    }
    values.push(val);
  }

  const result = currentExperiment.formula(...values).toFixed(3);

  readings.push({
    x: values[0],
    y: result
  });

  let row = "<tr>";
  values.forEach(v => row += <td>${v}</td>);
  row += <td>${result}</td></tr>;

  document.getElementById("tableBody").innerHTML += row;

  currentExperiment.inputs.forEach(name => {
    document.getElementById(name).value = "";
  });
}

/* ================= GRAPH ================= */

function plotGraph() {
  if (readings.length === 0) {
    alert("Add readings first");
    return;
  }

  const canvas = document.getElementById("graph");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // axes
  ctx.beginPath();
  ctx.moveTo(40, 10);
  ctx.lineTo(40, 260);
  ctx.lineTo(380, 260);
  ctx.stroke();

  ctx.fillText(currentExperiment.inputs[0], 180, 290);
  ctx.save();
  ctx.rotate(-Math.PI / 2);
  ctx.fillText(currentExperiment.output, -170, 15);
  ctx.restore();

  let maxX = Math.max(...readings.map(p => p.x));
  let maxY = Math.max(...readings.map(p => p.y));

  ctx.beginPath();
  readings.forEach((p, i) => {
    let x = 40 + (p.x / maxX) * 320;
    let y = 260 - (p.y / maxY) * 240;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

function clearGraph() {
  const ctx = document.getElementById("graph").getContext("2d");
  ctx.clearRect(0, 0, 400, 300);
}
</script>

</body>
</html>
