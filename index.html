<!DOCTYPE html>
<html>
<head>
  <title>Virtual Lab – Ohm’s Law (Correct Instruments)</title>
  <style>
    body { font-family: Arial; }

    #palette {
      width: 200px;
      border: 2px solid black;
      padding: 10px;
      float: left;
    }

    .component {
      background: #ddd;
      padding: 6px;
      margin: 6px 0;
      cursor: grab;
      font-weight: bold;
      text-align: center;
    }

    #workspace {
      margin-left: 220px;
      width: 600px;
      height: 260px;
      border: 2px dashed black;
      position: relative;
    }

    .placed {
      position: absolute;
      background: #bde;
      padding: 6px;
      border: 2px solid black;
      cursor: pointer;
    }

    .selected { border-color: red; }

    #panel {
      clear: both;
      margin-top: 20px;
      border: 1px solid black;
      padding: 10px;
      width: 860px;
    }

    #experiment {
      opacity: 0.4;
      pointer-events: none;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2>Virtual Lab – Ohm’s Law</h2>

<!-- PALETTE -->
<div id="palette">
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="battery">Battery</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="resistor">Resistor</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="ammeter">Ammeter</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="voltmeter">Voltmeter</div>
</div>

<!-- WORKSPACE -->
<div id="workspace" ondragover="allowDrop(event)" ondrop="drop(event)">
  Drop components here
</div>

<div id="panel">
  <button onclick="validateCircuit()">Validate Circuit</button>
  <span id="result"></span>

  <!-- EXPERIMENT -->
  <div id="experiment">
    <h3>Ohm’s Law Experiment</h3>

    Voltage (V):<br>
    <input type="number" id="voltage"><br><br>

    Resistance (Ω):<br>
    <input type="number" id="resistance"><br><br>

    <button onclick="addReading()">Add Reading</button>

    <h4>Observation Table</h4>
    <table border="1">
      <thead>
        <tr><th>V</th><th>R</th><th>I</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
/* ========== STATE ========== */
let placedComponents = [];
let connections = [];
let selected = null;
let componentCount = 0;
let circuitValidated = false;
let readings = [];

/* ========== DRAG & DROP ========== */
function drag(ev) {
  ev.dataTransfer.setData("type", ev.target.dataset.type);
}
function allowDrop(ev) { ev.preventDefault(); }
function drop(ev) {
  ev.preventDefault();
  const type = ev.dataTransfer.getData("type");
  componentCount++;

  const el = document.createElement("div");
  el.className = "placed";
  el.innerText = type;
  el.dataset.type = type;
  el.dataset.id = type + componentCount;
  el.style.left = ev.offsetX + "px";
  el.style.top = ev.offsetY + "px";
  el.onclick = () => select(el);

  workspace.appendChild(el);
  placedComponents.push({ id: el.dataset.id, type });
}

/* ========== CONNECTION LOGIC ========== */
function select(el) {
  if (!selected) {
    selected = el;
    el.classList.add("selected");
  } else {
    connections.push({ from: selected.dataset.id, to: el.dataset.id });
    selected.classList.remove("selected");
    selected = null;
  }
}

/* ========== VALIDATION (CORRECT) ========== */
function validateCircuit() {
  const counts = { battery:0, resistor:0, ammeter:0, voltmeter:0 };

  placedComponents.forEach(c => counts[c.type]++);

  if (counts.battery !== 1)
    return fail("Exactly ONE battery is required");

  if (counts.resistor !== 1)
    return fail("Exactly ONE resistor is required");

  if (counts.ammeter !== 1)
    return fail("Ammeter is mandatory to measure current");

  if (counts.voltmeter !== 1)
    return fail("Voltmeter is mandatory to measure voltage");

  circuitValidated = true;
  unlockExperiment();
  result.innerText = "✔ Correct circuit with proper instruments";
  result.style.color = "green";
}

function fail(msg) {
  circuitValidated = false;
  lockExperiment();
  result.innerText = "✖ " + msg;
  result.style.color = "red";
}

/* ========== EXPERIMENT GATE ========== */
function unlockExperiment() {
  experiment.style.opacity = "1";
  experiment.style.pointerEvents = "auto";
}
function lockExperiment() {
  experiment.style.opacity = "0.4";
  experiment.style.pointerEvents = "none";
}

/* ========== EXPERIMENT LOGIC ========== */
function addReading() {
  if (!circuitValidated) return;

  const V = Number(voltage.value);
  const R = Number(resistance.value);
  if (V <= 0 || R <= 0) return;

  const I = (V / R).toFixed(3);
  readings.push({ V, R, I });

  tableBody.innerHTML +=
    `<tr><td>${V}</td><td>${R}</td><td>${I}</td></tr>`;
}
</script>

</body>
</html>
