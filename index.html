<!DOCTYPE html>
<html>
<head>
  <style>
    #palette {
      width: 180px;
      padding: 10px;
      border: 2px solid black;
      float: left;
    }

    #workspace {
      margin-left: 200px;
      width: 600px;
      height: 350px;
      border: 2px dashed black;
      position: relative;
    }

    .component {
      padding: 8px;
      margin: 6px 0;
      background-color: lightgray;
      cursor: grab;
      text-align: center;
      font-weight: bold;
    }

    .placed {
      position: absolute;
      background-color: lightblue;
      padding: 8px;
      border: 2px solid black;
      cursor: pointer;
    }

    .selected {
      border: 2px solid red;
    }

    #status {
      clear: both;
      margin-top: 20px;
      padding: 10px;
      border: 1px solid black;
      width: 780px;
    }

    #result {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>Drag & Drop Circuit Builder</h2>

<!-- COMPONENT PALETTE -->
<div id="palette">
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="battery">Battery</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="resistor">Resistor</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="ammeter">Ammeter</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="voltmeter">Voltmeter</div>
</div>

<!-- WORKSPACE -->
<div id="workspace" ondragover="allowDrop(event)" ondrop="drop(event)">
  Drop components here
</div>

<!-- STATUS -->
<div id="status">
  <h3>Placed Components</h3>
  <ul id="componentList"></ul>

  <h3>Connections</h3>
  <ul id="connectionList"></ul>

  <button onclick="validateCircuit()">Validate Circuit</button>
  <div id="result"></div>
</div>

<script>
  let componentCount = 0;
  let placedComponents = [];
  let connections = [];
  let selectedComponent = null;

  function drag(ev) {
    ev.dataTransfer.setData("type", ev.target.dataset.type);
    ev.dataTransfer.setData("label", ev.target.innerText);
  }

  function allowDrop(ev) {
    ev.preventDefault();
  }

  function drop(ev) {
    ev.preventDefault();

    const type = ev.dataTransfer.getData("type");
    const label = ev.dataTransfer.getData("label");

    componentCount++;
    const id = type + componentCount;

    const comp = document.createElement("div");
    comp.className = "placed";
    comp.innerText = label;
    comp.dataset.type = type;
    comp.dataset.id = id;

    comp.style.left = ev.offsetX + "px";
    comp.style.top = ev.offsetY + "px";

    comp.onclick = () => selectComponent(comp);

    ev.target.appendChild(comp);

    placedComponents.push({ id, type });
    updateStatus();
  }

  function selectComponent(comp) {
    if (!selectedComponent) {
      selectedComponent = comp;
      comp.classList.add("selected");
    } else if (selectedComponent !== comp) {
      // create connection
      connections.push({
        from: selectedComponent.dataset.id,
        to: comp.dataset.id
      });

      selectedComponent.classList.remove("selected");
      selectedComponent = null;

      updateConnections();
    }
  }

  function updateStatus() {
    const list = document.getElementById("componentList");
    list.innerHTML = "";

    placedComponents.forEach(c => {
      const li = document.createElement("li");
      li.innerText = `${c.id} → ${c.type}`;
      list.appendChild(li);
    });

    document.getElementById("result").innerText = "";
  }

  function updateConnections() {
    const list = document.getElementById("connectionList");
    list.innerHTML = "";

    connections.forEach(c => {
      const li = document.createElement("li");
      li.innerText = `${c.from} ↔ ${c.to}`;
      list.appendChild(li);
    });
  }

  /* ===== Validation still only checks component rules ===== */

  function validateCircuit() {
    const counts = { battery:0, resistor:0, ammeter:0, voltmeter:0 };
    placedComponents.forEach(c => counts[c.type]++);

    if (counts.battery !== 1) return showError("Exactly one battery required");
    if (counts.resistor !== 1) return showError("Exactly one resistor required");
    if (counts.ammeter !== 1) return showError("Exactly one ammeter required");
    if (counts.voltmeter > 1) return showError("At most one voltmeter allowed");

    document.getElementById("result").innerText =
      "✔ Component rules passed (connections recorded)";
    document.getElementById("result").style.color = "green";
  }

  function showError(msg) {
    const r = document.getElementById("result");
    r.innerText = "✖ " + msg;
    r.style.color = "red";
  }
</script>

</body>
</html>
