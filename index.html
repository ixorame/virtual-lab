<!DOCTYPE html>
<html>
<body>

<!-- SCREEN 1 -->
<div id="screen1">
  <h2>Virtual Lab</h2>

  <label>Select Experiment</label><br><br>
  <select id="experiment">
    <option value="">-- Select --</option>
    <option value="ohm">Ohm's Law</option>
  </select><br><br>

  <button onclick="goNext()">Start Experiment</button>
</div>

<!-- SCREEN 2 -->
<div id="screen2" style="display:none;">
  <h2>Experiment Screen</h2>
  <p id="expName"></p>
</div>

<script>
  function goNext() {
    const exp = document.getElementById("experiment").value;

    if (exp === "") {
      alert("Please select an experiment");
      return;
    }

    document.getElementById("screen1").style.display = "none";
    document.getElementById("screen2").style.display = "block";
    document.getElementById("expName").innerText =
      "You selected: Ohm's Law";
  }
</script>

</body>
</html>
