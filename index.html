<!DOCTYPE html>
<html>
<body>

<!-- ================= SCREEN 1 ================= -->
<div id="screen1">
  <h2>Virtual Lab</h2>

  <select id="experimentSelect">
    <option value="">-- Select Experiment --</option>
    <option value="ohm">Ohm's Law</option>
    <option value="series">Series Resistance</option>
  </select>
  <br><br>

  <button onclick="startExperiment()">Start</button>
</div>

<!-- ================= SCREEN 2 ================= -->
<div id="screen2" style="display:none;">

  <h2 id="expTitle"></h2>

  <!-- THEORY -->
  <h3>Theory</h3>
  <p id="theoryText"></p>

  <!-- PROCEDURE -->
  <h3>Procedure</h3>
  <ol id="procedureList"></ol>

  <!-- INPUT -->
  <h3>Enter Values</h3>
  <div id="inputArea"></div>

  <button onclick="addReading()">Add Reading</button>

  <!-- TABLE -->
  <h3>Observation Table</h3>
  <table border="1" cellpadding="6">
    <thead>
      <tr id="tableHead"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

</div>

<script>
/* ================= EXPERIMENT DEFINITIONS ================= */

const experiments = {
  ohm: {
    title: "Ohm's Law Experiment",
    theory:
      "Ohm’s Law states that the current flowing through a conductor is directly proportional to the voltage applied across it, provided physical conditions remain constant. Mathematically, V = I × R.",
    procedure: [
      "Connect the resistor in the circuit.",
      "Apply a known voltage across the resistor.",
      "Measure the voltage and resistance values.",
      "Calculate the current using Ohm’s Law."
    ],
    inputs: ["V", "R"],
    output: "I",
    formula: (V, R) => V / R
  },

  series: {
    title: "Series Resistance Experiment",
    theory:
      "When resistors are connected in series, the equivalent resistance is equal to the sum of the individual resistances. Mathematically, Req = R₁ + R₂.",
    procedure: [
      "Connect two resistors in series.",
      "Measure the resistance values R₁ and R₂.",
      "Add the resistance values to obtain equivalent resistance."
    ],
    inputs: ["R1", "R2"],
    output: "Req",
    formula: (R1, R2) => R1 + R2
  }
};

let currentExperiment = null;

/* ================= START EXPERIMENT ================= */

function startExperiment() {
  const key = document.getElementById("experimentSelect").value;

  if (!key) {
    alert("Select an experiment");
    return;
  }

  currentExperiment = experiments[key];

  document.getElementById("screen1").style.display = "none";
  document.getElementById("screen2").style.display = "block";

  setupUI();
}

/* ================= SETUP UI ================= */

function setupUI() {
  // Title
  document.getElementById("expTitle").innerText = currentExperiment.title;

  // Theory
  document.getElementById("theoryText").innerText = currentExperiment.theory;

  // Procedure
  let procHTML = "";
  currentExperiment.procedure.forEach(step => {
    procHTML += <li>${step}</li>;
  });
  document.getElementById("procedureList").innerHTML = procHTML;

  // Inputs
  let inputHTML = "";
  currentExperiment.inputs.forEach(name => {
    inputHTML += `
      ${name}:<br>
      <input type="number" id="${name}" step="0.1"><br><br>
    `;
  });
  document.getElementById("inputArea").innerHTML = inputHTML;

  // Table head
  let headHTML = "";
  currentExperiment.inputs.forEach(name => {
    headHTML += <th>${name}</th>;
  });
  headHTML += <th>${currentExperiment.output}</th>;

  document.getElementById("tableHead").innerHTML = headHTML;
  document.getElementById("tableBody").innerHTML = "";
}

/* ================= ADD READING ================= */

function addReading() {
  let values = [];

  for (let name of currentExperiment.inputs) {
    const val = Number(document.getElementById(name).value);
    if (val <= 0) {
      alert("Enter valid values");
      return;
    }
    values.push(val);
  }

  const result = currentExperiment.formula(...values).toFixed(3);

  let row = "<tr>";
  values.forEach(v => row += <td>${v}</td>);
  row += <td>${result}</td></tr>;

  document.getElementById("tableBody").innerHTML += row;

  // clear inputs
  currentExperiment.inputs.forEach(name => {
    document.getElementById(name).value = "";
  });
}
</script>

</body>
</html>
