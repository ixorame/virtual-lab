<!DOCTYPE html>
<html>
<head>
  <title>Virtual Lab – Component Values</title>
  <style>
    body { font-family: Arial; }

    #palette {
      width: 240px;
      border: 2px solid black;
      padding: 10px;
      float: left;
    }

    .component {
      background: #ddd;
      padding: 6px;
      margin: 6px 0;
      cursor: grab;
      font-weight: bold;
      text-align: center;
    }

    #workspace {
      margin-left: 260px;
      width: 600px;
      height: 260px;
      border: 2px dashed black;
      position: relative;
    }

    .placed {
      position: absolute;
      background: #bde;
      padding: 6px;
      border: 2px solid black;
      cursor: pointer;
      font-size: 13px;
    }

    .selected { border-color: red; }

    #panel {
      clear: both;
      margin-top: 20px;
      border: 1px solid black;
      padding: 10px;
      width: 920px;
    }

    #experiment {
      opacity: 0.4;
      pointer-events: none;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2>Virtual Lab – Ohm’s Law (Component Values)</h2>

<!-- PALETTE -->
<div id="palette">
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="battery">Battery</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="resistor">Resistor</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="ammeter">Ammeter</div>
  <div class="component" draggable="true" ondragstart="drag(event)" data-type="voltmeter">Voltmeter</div>
</div>

<!-- WORKSPACE -->
<div id="workspace" ondragover="allowDrop(event)" ondrop="drop(event)">
  Drop components here
</div>

<div id="panel">
  <button onclick="validateCircuit()">Validate Circuit</button>
  <span id="result"></span>

  <!-- EXPERIMENT -->
  <div id="experiment">
    <h3>Ohm’s Law Experiment</h3>

    <button onclick="addReading()">Add Reading</button>

    <h4>Observation Table</h4>
    <table border="1">
      <thead>
        <tr><th>Voltage (V)</th><th>Resistance (Ω)</th><th>Current (A)</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <h4>Simulation (Current Flow)</h4>
    <canvas id="sim" width="400" height="80" style="border:1px solid black;"></canvas>
  </div>
</div>

<script>
/* ===== STATE ===== */
let placedComponents = [];
let connections = [];
let selected = null;
let componentCount = 0;
let circuitValidated = false;
let readings = [];

let simInterval = null;
let electronX = 20;

/* ===== DRAG & DROP ===== */
function drag(ev) {
  ev.dataTransfer.setData("type", ev.target.dataset.type);
}
function allowDrop(ev) { ev.preventDefault(); }
function drop(ev) {
  ev.preventDefault();
  const type = ev.dataTransfer.getData("type");
  componentCount++;

  const comp = {
    id: type + componentCount,
    type: type,
    value: null
  };

  const el = document.createElement("div");
  el.className = "placed";
  el.innerText = type;
  el.dataset.id = comp.id;
  el.onclick = () => componentClick(comp, el);

  el.style.left = ev.offsetX + "px";
  el.style.top = ev.offsetY + "px";

  workspace.appendChild(el);
  placedComponents.push(comp);
}

/* ===== COMPONENT VALUE SETTING ===== */
function componentClick(comp, el) {
  if (comp.type === "resistor") {
    const v = prompt("Enter resistance in ohms (Ω):", comp.value ?? "");
    if (v !== null && v > 0) {
      comp.value = Number(v);
      el.innerText = `Resistor (${comp.value} Ω)`;
    }
  }

  if (comp.type === "battery") {
    const v = prompt("Enter battery voltage (V):", comp.value ?? "");
    if (v !== null && v > 0) {
      comp.value = Number(v);
      el.innerText = `Battery (${comp.value} V)`;
    }
  }

  // selection for connection
  if (!selected) {
    selected = el;
    el.classList.add("selected");
  } else if (selected !== el) {
    connections.push({
      from: selected.dataset.id,
      to: el.dataset.id
    });
    selected.classList.remove("selected");
    selected = null;
  }
}

/* ===== VALIDATION ===== */
function validateCircuit() {
  const counts = { battery:0, resistor:0, ammeter:0, voltmeter:0 };
  let battery = null;
  let resistor = null;

  placedComponents.forEach(c => {
    counts[c.type]++;
    if (c.type === "battery") battery = c;
    if (c.type === "resistor") resistor = c;
  });

  if (counts.battery !== 1) return fail("Exactly one battery required");
  if (counts.resistor !== 1) return fail("Exactly one resistor required");
  if (counts.ammeter !== 1) return fail("Ammeter is mandatory");
  if (counts.voltmeter !== 1) return fail("Voltmeter is mandatory");

  if (!battery.value) return fail("Set battery voltage");
  if (!resistor.value) return fail("Set resistor value");

  circuitValidated = true;
  unlockExperiment();
  result.innerText = "✔ Circuit and values are valid";
  result.style.color = "green";
}

function fail(msg) {
  circuitValidated = false;
  stopSimulation();
  lockExperiment();
  result.innerText = "✖ " + msg;
  result.style.color = "red";
}

/* ===== EXPERIMENT GATE ===== */
function unlockExperiment() {
  experiment.style.opacity = "1";
  experiment.style.pointerEvents = "auto";
}
function lockExperiment() {
  experiment.style.opacity = "0.4";
  experiment.style.pointerEvents = "none";
}

/* ===== EXPERIMENT LOGIC ===== */
function addReading() {
  if (!circuitValidated) return;

  const battery = placedComponents.find(c => c.type === "battery");
  const resistor = placedComponents.find(c => c.type === "resistor");

  const V = battery.value;
  const R = resistor.value;
  const I = (V / R).toFixed(3);

  readings.push({ V, R, I });

  tableBody.innerHTML +=
    `<tr><td>${V}</td><td>${R}</td><td>${I}</td></tr>`;

  startSimulation(Number(I));
}

/* ===== SIMULATION ===== */
function startSimulation(current) {
  const ctx = sim.getContext("2d");
  if (simInterval) clearInterval(simInterval);
  electronX = 20;

  const speed = Math.max(current * 10, 2);

  simInterval = setInterval(() => {
    ctx.clearRect(0,0,400,80);
    ctx.fillStyle = "black";
    ctx.fillRect(10,35,380,8);

    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(electronX,39,5,0,Math.PI*2);
    ctx.fill();

    electronX += speed;
    if (electronX > 390) electronX = 10;
  }, 100);
}

function stopSimulation() {
  if (simInterval) clearInterval(simInterval);
}
</script>

</body>
</html>
